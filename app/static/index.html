<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Southwest Vacations — Hotel Explorer</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f7f8fa;
    --fg: #17202a;
    --card-bg: #ffffff;
    --border: #e1e5ea;
    --accent: #0a5c8a;
    --muted: #667085;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14171a;
      --fg: #eef1f4;
      --card-bg: #1d2126;
      --border: #2d333a;
      --accent: #6fc0ee;
      --muted: #9aa4af;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--fg);
    padding: 2rem 1rem 4rem;
  }
  h1 { text-align: center; margin: 0 0 0.25rem; }
  .subtitle { text-align: center; color: var(--muted); margin-bottom: 2.5rem; }
  .destination-section { max-width: 900px; margin: 0 auto 3rem; }
  .destination-title {
    font-size: 1.4rem;
    border-bottom: 2px solid var(--accent);
    padding-bottom: 0.5rem;
    margin-bottom: 1rem;
  }
  details.hotel {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    margin-bottom: 0.75rem;
    overflow: hidden;
  }
  details.hotel > summary {
    cursor: pointer;
    padding: 1rem 1.25rem;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 1rem;
    list-style: none;
    font-weight: 600;
  }
  details.hotel > summary::-webkit-details-marker { display: none; }
  summary .hotel-name { flex: 1; }
  summary .hotel-meta { color: var(--muted); font-size: 0.85rem; font-weight: 400; white-space: nowrap; }
  .hotel-body { padding: 0 1.25rem 1.25rem; }
  .carousel {
    display: flex;
    overflow-x: auto;
    scroll-snap-type: x mandatory;
    gap: 0.5rem;
    margin-bottom: 1rem;
    border-radius: 8px;
  }
  .carousel img {
    scroll-snap-align: start;
    flex: 0 0 100%;
    max-height: 320px;
    width: 100%;
    object-fit: cover;
    border-radius: 8px;
    background: var(--border);
  }
  .carousel.empty {
    display: flex;
    align-items: center;
    justify-content: center;
    height: 120px;
    color: var(--muted);
    border: 1px dashed var(--border);
  }
  .description { line-height: 1.5; white-space: pre-line; margin-bottom: 1rem; }
  .amenities { display: flex; flex-wrap: wrap; gap: 0.4rem; }
  .amenity-pill {
    background: var(--bg);
    border: 1px solid var(--border);
    padding: 0.25rem 0.6rem;
    border-radius: 999px;
    font-size: 0.8rem;
    color: var(--muted);
  }
  .loading, .error { text-align: center; color: var(--muted); margin-top: 3rem; }
</style>
</head>
<body>
  <h1>Southwest Vacations</h1>
  <p class="subtitle" id="subtitle">Loading hotels…</p>
  <div id="root"></div>

<script>
const fmtAmenity = (a) => a.replace(/_/g, ' ').toLowerCase().replace(/\b\w/g, c => c.toUpperCase());

async function load() {
  const root = document.getElementById('root');
  const subtitle = document.getElementById('subtitle');
  try {
    const res = await fetch('/southwestvacations/');
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const hotels = await res.json();

    const byDest = {};
    for (const h of hotels) {
      (byDest[h.destination] ??= []).push(h);
    }

    subtitle.textContent = `${hotels.length} hotels across ${Object.keys(byDest).length} destinations`;

    root.innerHTML = '';
    for (const dest of Object.keys(byDest).sort()) {
      const section = document.createElement('section');
      section.className = 'destination-section';

      const title = document.createElement('h2');
      title.className = 'destination-title';
      title.textContent = `${dest} (${byDest[dest].length})`;
      section.appendChild(title);

      for (const hotel of byDest[dest]) {
        section.appendChild(renderHotel(hotel));
      }
      root.appendChild(section);
    }
  } catch (err) {
    subtitle.textContent = '';
    root.innerHTML = `<p class="error">Couldn't load hotels: ${err.message}</p>`;
  }
}

function renderHotel(hotel) {
  const details = document.createElement('details');
  details.className = 'hotel';

  const summary = document.createElement('summary');
  const name = document.createElement('span');
  name.className = 'hotel-name';
  name.textContent = hotel.name;
  const meta = document.createElement('span');
  meta.className = 'hotel-meta';
  const star = hotel.star_rating ? `★ ${hotel.star_rating}` : '';
  const cost = hotel.base_cost || '';
  meta.textContent = [star, cost].filter(Boolean).join('  ·  ');
  summary.appendChild(name);
  summary.appendChild(meta);
  details.appendChild(summary);

  const body = document.createElement('div');
  body.className = 'hotel-body';

  // Prefer the hotel's own gallery; fall back to room-type photos for the
  // rare hotel whose detail capture only returned room data.
  const hotelImages = (hotel.images || []).filter(Boolean);
  const roomImages = [...new Set((hotel.room_types || []).flatMap(rt => rt.images || []))].filter(Boolean);
  const images = hotelImages.length ? hotelImages : roomImages;
  if (images.length) {
    const carousel = document.createElement('div');
    carousel.className = 'carousel';
    for (const src of images) {
      const img = document.createElement('img');
      img.src = src;
      img.loading = 'lazy';
      img.alt = hotel.name;
      carousel.appendChild(img);
    }
    body.appendChild(carousel);
  } else {
    const empty = document.createElement('div');
    empty.className = 'carousel empty';
    empty.textContent = 'No images available';
    body.appendChild(empty);
  }

  if (hotel.description) {
    const desc = document.createElement('p');
    desc.className = 'description';
    desc.textContent = hotel.description;
    body.appendChild(desc);
  }

  if (hotel.amenities && hotel.amenities.length) {
    const amenities = document.createElement('div');
    amenities.className = 'amenities';
    for (const a of hotel.amenities) {
      const pill = document.createElement('span');
      pill.className = 'amenity-pill';
      pill.textContent = fmtAmenity(a);
      amenities.appendChild(pill);
    }
    body.appendChild(amenities);
  }

  details.appendChild(body);
  return details;
}

load();
</script>
</body>
</html>
